spring:
  application:
    name: restricted-file-sharing-system

  datasource:
    url: jdbc:h2:file:./data/restricteddb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console


  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: restrictedSecretKeyrestrictedSecretKeyrestrictedSecretKeyrestricted
  expiration: 3600000

app:
  file:
    max-size-mb: 50
    upload-dir: uploads
  verification:
    cooldown:
      minutes: 5

logging:
  level:
    com.restrictedfileshare: INFO
    org.springframework.security: WARN